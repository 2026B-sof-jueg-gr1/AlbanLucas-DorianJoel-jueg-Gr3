<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Demo - Phaser 3</title>
    <!-- Phaser 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #12131a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            border: 4px solid #333a56;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            background: #5c94fc;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .controls-hint {
            margin-top: 12px;
            font-size: 14px;
            color: #a0aec0;
            text-align: center;
            user-select: none;
        }

        .controls-hint span {
            display: inline-block;
            background: #232738;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #4a5568;
            color: #f7fafc;
            font-weight: bold;
            margin: 0 2px;
        }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <div class="controls-hint">
        <span>⬅️ ➡️ / A D</span> Moverse | 
        <span>⬆️ / W / ESPACIO</span> Saltar (Mantener en aire con Capa: Planear 🪶) | 
        <span>ENTER</span> Seleccionar
    </div>

    <!-- Entrada modular ES Modules -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
